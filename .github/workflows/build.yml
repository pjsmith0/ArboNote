name: Build

on:
  push:
    branches: [ "main", "javafx" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ArboNote-jar
          path: target/*.jar
