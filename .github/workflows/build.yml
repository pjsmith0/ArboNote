name: Build native packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            profile: package-linux
          - name: windows
            os: windows-latest
            profile: package-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build jar and native packages
        run: mvn -B clean package -P${{ matrix.profile }}

      - name: Archive Linux app image (portable)
        if: runner.os == 'Linux'
        run: tar -czf ArboNote-linux-app-image.tar.gz -C target/installer ArboNote

      - name: Archive Windows app image (portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/installer/ArboNote -DestinationPath ArboNote-windows-app-image.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArboNote-${{ matrix.name }}
          path: |
            target/installer/*
            ArboNote-*-app-image.tar.gz
            ArboNote-*-app-image.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.deb \
            release-assets/*.exe \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            --generate-notes
